name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Clean Flutter Android Project
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --org com.everrise --project-name routine_alarm_app .
          cp /tmp/main.dart lib/main.dart
          flutter pub add flutter_tts shared_preferences intl

      - name: Fix Android Manifest Permissions
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.VIBRATE"\/><uses-permission android:name="android.permission.WAKE_LOCK"\/><application/g' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Routine-Voice-Alarm-2026-APK
          path: build/app/outputs/flutter-apk/app-release.apk
